<?xml version="1.1" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <title>本体运维闭环：改口径是一次可审计的数据操作</title>
    <defs>
        <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
            <path d="M0,0 L10,5 L0,10 Z" fill="#f59e0b"/>
        </marker>
        <marker id="arrowGray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
            <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
        </marker>
        <linearGradient id="gradAmber" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fbbf24"/>
            <stop offset="1" stop-color="#d97706"/>
        </linearGradient>
        <radialGradient id="bgVignette" cx="0.5" cy="0.34" r="1.05">
            <stop offset="0" stop-color="#12100a"/>
            <stop offset="0.55" stop-color="#0d0c09"/>
            <stop offset="1" stop-color="#080a0e"/>
        </radialGradient>
        <radialGradient id="centerGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#f59e0b" stop-opacity="0.16"/>
            <stop offset="0.7" stop-color="#f59e0b" stop-opacity="0.05"/>
            <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
        </radialGradient>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
        </filter>
    </defs>

    <rect x="0" y="0" width="1200" height="720" fill="url(#bgVignette)"/>

    <!-- 标题 -->
    <text x="600" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#e2e8f0">本体运维闭环</text>
    <text x="600" y="64" text-anchor="middle" font-size="12" fill="#94a3b8">新术语上线不重启、全程审计、改完即验证、可一键回退 —— 这是本体路线独有的运维方式</text>

    <!-- 中心光晕与主文案 -->
    <circle cx="600" cy="372" r="150" fill="url(#centerGlow)"/>
    <text x="600" y="352" text-anchor="middle" font-size="21" font-weight="700" fill="#fbbf24">改口径 = 一次数据操作</text>
    <text x="600" y="380" text-anchor="middle" font-size="12.5" fill="#e2e8f0">不是改提示词，不是重新训练</text>
    <text x="600" y="404" text-anchor="middle" font-size="11.5" fill="#94a3b8">可审计 · 可回退 · 免重启 · 零 token</text>

    <!-- 环形连线（六段弧） -->
    <path d="M 736 172 A 220 220 0 0 1 790 190" fill="none" stroke="#f59e0b" stroke-opacity="0.75" stroke-width="2" marker-end="url(#arrowAmber)"/>
    <path d="M 856 272 A 220 220 0 0 1 900 422" fill="none" stroke="#f59e0b" stroke-opacity="0.75" stroke-width="2" marker-end="url(#arrowAmber)"/>
    <path d="M 776 504 A 220 220 0 0 1 736 574" fill="none" stroke="#f59e0b" stroke-opacity="0.75" stroke-width="2" marker-end="url(#arrowAmber)"/>
    <path d="M 468 580 A 220 220 0 0 1 404 494" fill="none" stroke="#f59e0b" stroke-opacity="0.75" stroke-width="2" marker-end="url(#arrowAmber)"/>
    <path d="M 300 424 A 220 220 0 0 1 262 276" fill="none" stroke="#f59e0b" stroke-opacity="0.75" stroke-width="2" marker-end="url(#arrowAmber)"/>

    <!-- 节点 1：编辑（顶部） -->
    <rect x="470" y="96" width="260" height="72" rx="12" fill="#171310" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="496" cy="120" r="12" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b"/>
    <text x="496" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">1</text>
    <text x="516" y="124" font-size="12.5" font-weight="700" fill="#e2e8f0">编辑本体元数据</text>
    <text x="516" y="142" font-size="10.5" fill="#94a3b8">实例 / 同义词 / 物理映射，浏览器里改</text>
    <text x="516" y="158" font-size="10.5" fill="#94a3b8">覆盖缺口扫描发现新写法，一键收录</text>

    <!-- 节点 2：写入+审计（右上） -->
    <rect x="724" y="196" width="260" height="72" rx="12" fill="#171310" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="750" cy="220" r="12" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b"/>
    <text x="750" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">2</text>
    <text x="770" y="224" font-size="12.5" font-weight="700" fill="#e2e8f0">事务写入 + 审计落库</text>
    <text x="770" y="242" font-size="10.5" fill="#94a3b8">ont_change_log 行级前后镜像</text>
    <text x="770" y="258" font-size="10.5" fill="#94a3b8">一次保存 = 一个变更集，串行编号</text>

    <!-- 节点 3：热加载（右下） -->
    <rect x="780" y="428" width="260" height="72" rx="12" fill="#171310" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="806" cy="452" r="12" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b"/>
    <text x="806" y="456" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">3</text>
    <text x="826" y="456" font-size="12.5" font-weight="700" fill="#e2e8f0">热加载 · 免重启</text>
    <text x="826" y="474" font-size="10.5" fill="#94a3b8">内存模型整体热替换</text>
    <text x="826" y="490" font-size="10.5" fill="#94a3b8">保存后第一问就用新本体</text>

    <!-- 节点 4：基准验证（底部） -->
    <rect x="470" y="576" width="260" height="72" rx="12" fill="#171310" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="496" cy="600" r="12" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b"/>
    <text x="496" y="604" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">4</text>
    <text x="516" y="604" font-size="12.5" font-weight="700" fill="#e2e8f0">36 题内存基准验证</text>
    <text x="516" y="622" font-size="10.5" fill="#94a3b8">before / after 同题比对，秒级完成</text>
    <text x="516" y="638" font-size="10.5" fill="#94a3b8">内存比对，不污染正式基准历史</text>

    <!-- 节点 5：验证报告（左下） -->
    <rect x="128" y="428" width="260" height="72" rx="12" fill="#171310" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="154" cy="452" r="12" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b"/>
    <text x="154" y="456" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">5</text>
    <text x="174" y="456" font-size="12.5" font-weight="700" fill="#e2e8f0">验证报告如实呈现</text>
    <text x="174" y="474" font-size="10.5" fill="#94a3b8">回归题号、提升题号逐条列出</text>
    <text x="174" y="490" font-size="10.5" fill="#94a3b8">回归不阻断，事实交给人工判断</text>

    <!-- 节点 6：人工决策（左上） -->
    <rect x="128" y="196" width="260" height="72" rx="12" fill="#171310" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="154" cy="220" r="12" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b"/>
    <text x="154" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">6</text>
    <text x="174" y="224" font-size="12.5" font-weight="700" fill="#e2e8f0">保留，或一键回退</text>
    <text x="174" y="242" font-size="10.5" fill="#94a3b8">回退按操作前镜像逆序恢复</text>
    <text x="174" y="258" font-size="10.5" fill="#94a3b8">回退本身也是一条可追溯变更集</text>

    <!-- 闭环箭头：6 -> 1 -->
    <path d="M 258 196 L 258 132 Q 258 116 274 116 L 456 116" fill="none" stroke="#f59e0b" stroke-opacity="0.75" stroke-width="2" marker-end="url(#arrowAmber)"/>

    <!-- 旁注：护栏 -->
    <rect x="1004" y="314" width="164" height="116" rx="10" fill="#11151d" stroke="#2a3242"/>
    <text x="1086" y="344" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e2e8f0">四层护栏</text>
    <text x="1086" y="366" text-anchor="middle" font-size="10.5" fill="#94a3b8">核心演示实例改删锁定</text>
    <text x="1086" y="384" text-anchor="middle" font-size="10.5" fill="#94a3b8">取值表达式白名单校验</text>
    <text x="1086" y="402" text-anchor="middle" font-size="10.5" fill="#94a3b8">列存在性与表白名单</text>
    <text x="1086" y="420" text-anchor="middle" font-size="10.5" fill="#94a3b8">SafeQueryExecutor 兜底</text>
    <path d="M 1044 464 L 1086 464 L 1086 436" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>

    <!-- 底部对照条 -->
    <rect x="64" y="664" width="1072" height="40" rx="10" fill="#1a1013" stroke="#7f1d1d" stroke-opacity="0.55"/>
    <text x="600" y="689" text-anchor="middle" font-size="12" fill="#fca5a5">对照：提示词路线改口径 = 修改提示词后全量重测 —— 无逐字审计、无基准前后比对、无回退，效果取决于模型的下一次发挥</text>
</svg>
